[workspace]
resolver = "2"
members = ["crates/llm"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rust_decimal = { version = "1", features = ["serde-with-str", "maths"] }
chrono = { version = "0.4", features = ["serde"] }

[package]
name = "rust-one-api"
version = "0.1.0"
edition = "2021"
description = "Rust LLM API gateway: protocol relay, pricing/billing, channel quota"

[dependencies]
llm = { path = "crates/llm" }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = "0.9"
thiserror = { workspace = true }
rust_decimal = { workspace = true }
chrono = { workspace = true }
anyhow = "1"
axum = "0.8"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "any", "sqlite", "postgres", "migrate", "json"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
futures = "0.3"
async-trait = "0.1"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
bytes = "1"
base64 = "0.22"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
