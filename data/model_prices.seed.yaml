# gemini-2.5-pro tiered above/below 200k tokens (tier quantities are tokens, price per 1M);
# cached read price uncertain — verify before billing.
- model: gemini-2.5-pro
  price:
    items:
      - code: prompt_tokens
        pricing:
          mode: usage_tiered
          unit_size: 1000000
          tiers:
            - {up_to: 200000, unit_price: "1.25"}
            - {up_to: null, unit_price: "2.50"}
      - code: completion_tokens
        pricing:
          mode: usage_tiered
          unit_size: 1000000
          tiers:
            - {up_to: 200000, unit_price: "10.00"}
            - {up_to: null, unit_price: "15.00"}
      - {code: cached_tokens, pricing: {mode: usage_per_unit, unit_price: "0.31", unit_size: 1000000}}
